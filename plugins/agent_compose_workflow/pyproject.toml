[project]
name = "dify-plugin-agent-compose-workflow"
version = "0.4.3"
requires-python = ">=3.12"
dependencies = ["dify_plugin>=0.9.0", "requests>=2.34.2"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pyyaml>=6.0.0", "responses>=0.25.0", "ruff==0.16.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
detect-same-package = false
