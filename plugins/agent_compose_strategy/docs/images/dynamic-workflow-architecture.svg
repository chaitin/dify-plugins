<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">dynamic-workflow 连接 Dify 与 agent-compose</title>
  <desc id="desc">Dify 负责应用入口与业务编排，dynamic-workflow 负责协议桥接，agent-compose 负责复杂 Agent 的隔离执行与生命周期管理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#edf1ff"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6657e8"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26356f" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8190b5"/>
    </marker>
    <style>
      .title { font: 700 46px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #18213d; }
      .subtitle { font: 400 22px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64708f; }
      .layer-title { font: 700 30px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #263253; }
      .layer-note { font: 400 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #697691; }
      .card-title { font: 700 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #2f3b5d; text-anchor: middle; }
      .card-note { font: 400 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #6e7891; text-anchor: middle; }
      .tag { font: 600 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="250" fill="#ddd7ff" opacity=".3"/>
  <circle cx="120" cy="830" r="260" fill="#d5e9ff" opacity=".35"/>
  <text x="800" y="76" text-anchor="middle" class="title">让 Dify 与 agent-compose 各自发挥所长</text>
  <text x="800" y="118" text-anchor="middle" class="subtitle">熟悉的应用入口与业务编排，连接更强的 Agent 执行与运行时能力</text>

  <g filter="url(#shadow)">
    <rect x="95" y="185" width="400" height="570" rx="30" fill="#fff"/>
    <rect x="600" y="255" width="400" height="430" rx="30" fill="url(#bridge)"/>
    <rect x="1105" y="185" width="400" height="570" rx="30" fill="#fff"/>
  </g>

  <g>
    <circle cx="295" cy="260" r="44" fill="#eaf3ff"/>
    <rect x="271" y="242" width="48" height="36" rx="7" fill="none" stroke="#5793ea" stroke-width="4"/>
    <circle cx="283" cy="254" r="4" fill="#5793ea"/>
    <circle cx="307" cy="266" r="4" fill="#5793ea"/>
    <path d="M287 254 H299 V266 H303" fill="none" stroke="#5793ea" stroke-width="3"/>
    <text x="295" y="337" text-anchor="middle" class="layer-title">Dify</text>
    <text x="295" y="370" text-anchor="middle" class="layer-note">应用入口与业务编排层</text>

    <rect x="145" y="418" width="130" height="100" rx="18" fill="#f3f7ff" stroke="#c7d8f5"/>
    <rect x="315" y="418" width="130" height="100" rx="18" fill="#f3f7ff" stroke="#c7d8f5"/>
    <rect x="145" y="552" width="130" height="100" rx="18" fill="#f3f7ff" stroke="#c7d8f5"/>
    <rect x="315" y="552" width="130" height="100" rx="18" fill="#f3f7ff" stroke="#c7d8f5"/>
    <text x="210" y="462" class="card-title">用户入口</text>
    <text x="210" y="490" class="card-note">应用与会话</text>
    <text x="380" y="462" class="card-title">Workflow</text>
    <text x="380" y="490" class="card-note">节点与数据流</text>
    <text x="210" y="596" class="card-title">知识库</text>
    <text x="210" y="624" class="card-note">上下文增强</text>
    <text x="380" y="596" class="card-title">业务集成</text>
    <text x="380" y="624" class="card-note">工具与 API</text>
  </g>

  <g>
    <circle cx="800" cy="328" r="44" fill="#ffffff" opacity=".17"/>
    <path d="M775 328 H825 M800 303 V353" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="800" cy="328" r="19" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="800" y="406" text-anchor="middle" class="layer-title" fill="#fff">dynamic-workflow</text>
    <text x="800" y="440" text-anchor="middle" class="layer-note" fill="#ebe8ff">Dify 与 Agent 执行层之间的桥梁</text>

    <rect x="655" y="490" width="135" height="54" rx="27" fill="#fff" opacity=".16"/>
    <rect x="810" y="490" width="135" height="54" rx="27" fill="#fff" opacity=".16"/>
    <text x="722" y="518" class="tag">Workflow Tool</text>
    <text x="878" y="518" class="tag">Agent Strategy</text>

    <path d="M690 598 H910" stroke="#fff" stroke-width="2" opacity=".45"/>
    <text x="800" y="632" text-anchor="middle" class="layer-note" fill="#fff">传递 Query、Instruction 与运行配置</text>
  </g>

  <g>
    <circle cx="1305" cy="260" r="44" fill="#eeeaff"/>
    <path d="M1279 273 L1305 242 L1331 273 Z" fill="none" stroke="#735be8" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="1305" cy="263" r="7" fill="#735be8"/>
    <text x="1305" y="337" text-anchor="middle" class="layer-title">agent-compose</text>
    <text x="1305" y="370" text-anchor="middle" class="layer-note">复杂 Agent 执行与运行时层</text>

    <rect x="1155" y="418" width="130" height="100" rx="18" fill="#f6f3ff" stroke="#d8cef9"/>
    <rect x="1325" y="418" width="130" height="100" rx="18" fill="#f6f3ff" stroke="#d8cef9"/>
    <rect x="1155" y="552" width="130" height="100" rx="18" fill="#f6f3ff" stroke="#d8cef9"/>
    <rect x="1325" y="552" width="130" height="100" rx="18" fill="#f6f3ff" stroke="#d8cef9"/>
    <text x="1220" y="462" class="card-title">隔离沙箱</text>
    <text x="1220" y="490" class="card-note">运行环境</text>
    <text x="1390" y="462" class="card-title">Workspace</text>
    <text x="1390" y="490" class="card-note">代码与文件</text>
    <text x="1220" y="596" class="card-title">Agent CLI</text>
    <text x="1220" y="624" class="card-note">模型与工具</text>
    <text x="1390" y="596" class="card-title">生命周期</text>
    <text x="1390" y="624" class="card-note">调度与日志</text>
  </g>

  <path d="M495 430 H585" fill="none" stroke="#8190b5" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1000 430 H1090" fill="none" stroke="#8190b5" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1090 570 H1015" fill="none" stroke="#8190b5" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M585 570 H510" fill="none" stroke="#8190b5" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <text x="800" y="818" text-anchor="middle" class="layer-note">Dify 保持低门槛体验 · dynamic-workflow 完成能力桥接 · agent-compose 打开复杂 Agent 的能力上限</text>
</svg>
