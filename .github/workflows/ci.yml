name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plugins.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plugins
        run: echo "matrix=$(python3 scripts/discover_plugins.py)" >> "$GITHUB_OUTPUT"
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.8.3', enable-cache: true}
      - uses: arduino/setup-task@v2
        with: {version: '3.44.1'}
      - run: uv sync --frozen
      - run: uv run ruff check scripts tests
      - run: uv run ruff format --check scripts tests
      - run: uv run pytest
      - run: uv run python scripts/validate_plugins.py
  plugin:
    needs: discover
    if: ${{ fromJSON(needs.discover.outputs.matrix).plugin[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.8.3', enable-cache: true}
      - uses: arduino/setup-task@v2
        with: {version: '3.44.1'}
      - run: task --dir "${{ matrix.path }}" check
      - run: task --dir "${{ matrix.path }}" build DIST_DIR="$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.difypkg
          if-no-files-found: error
