[project]
name = "chaitin-dify-plugins-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3,<7"]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "pytest>=9.1.1,<10",
  "reuse==6.2.0",
  "ruff>=0.16.0,<0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
