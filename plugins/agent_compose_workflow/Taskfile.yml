version: "3"

vars:
  PYTHON_VERSION: "3.12"
  PACKAGE: agent_compose_workflow.difypkg
  DEV_DEPS: --no-project --with-requirements requirements.txt --with pytest --with responses --with ruff==0.16.0

tasks:
  setup:
    cmds:
      - uv venv --python {{.PYTHON_VERSION}}
      - uv pip install -r requirements.txt pytest responses ruff==0.16.0
  lint:
    cmds:
      - uv run --python {{.PYTHON_VERSION}} {{.DEV_DEPS}} ruff check .
      - uv run --python {{.PYTHON_VERSION}} {{.DEV_DEPS}} ruff format --check .
  test:
    cmds: ['uv run --python {{.PYTHON_VERSION}} {{.DEV_DEPS}} pytest -q tests']
  validate:
    cmds:
      - test -f manifest.yaml
      - test -f PRIVACY.md
      - test -f README.md
      - test -f README.zh-CN.md
      - grep -q minimum_dify_version manifest.yaml
  check:
    cmds:
      - task: lint
      - task: test
      - task: validate
  build:
    deps: [check]
    cmds:
      - mkdir -p dist
      - '{{default "dify" .DIFY_PLUGIN_CLI}} plugin package . --output_path "$PWD/dist/{{.PACKAGE}}"'
  clean:
    cmds: [rm -rf dist .pytest_cache .ruff_cache]
