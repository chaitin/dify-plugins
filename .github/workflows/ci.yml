name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plugins.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: plugins
        run: echo "matrix=$(python3 scripts/discover_plugins.py)" >> "$GITHUB_OUTPUT"
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: {version: '0.8.3', enable-cache: true}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with: {version: '3.44.1'}
      - run: uv sync --frozen
      - run: uv run ruff check scripts tests
      - run: uv run ruff format --check scripts tests
      - run: uv run pytest
      - run: uv run python scripts/validate_plugins.py
      - run: task license
      - run: task security
  plugin:
    needs: discover
    if: ${{ fromJSON(needs.discover.outputs.matrix).plugin[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: {version: '0.8.3', enable-cache: true}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with: {version: '3.44.1'}
      - run: task --dir "${{ matrix.plugin.path }}" check
      - id: cli
        run: echo "path=$(scripts/resolve-dify-plugin-cli.sh)" >> "$GITHUB_OUTPUT"
      - run: task --dir "${{ matrix.plugin.path }}" build DIST_DIR="$GITHUB_WORKSPACE/dist"
        env:
          DIFY_PLUGIN_CLI: ${{ steps.cli.outputs.path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.plugin.name }}
          path: dist/${{ matrix.plugin.name }}-*.difypkg
          if-no-files-found: error
  plugins:
    if: ${{ always() }}
    needs: plugin
    runs-on: ubuntu-24.04
    steps:
      - name: Require every plugin matrix job to pass
        env:
          RESULT: ${{ needs.plugin.result }}
        run: test "${RESULT}" = success
