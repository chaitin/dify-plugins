version: 0.1.0
type: plugin
author: chaitin
name: chaitin_ioc
label:
  en_US: Chaitin BaichuanCloud Threat Intelligence Service
  zh_Hans: 长亭百川云威胁情报服务
  ja_JP: 長亭百川クラウド脅威情報サービス
  pt_BR: Bedrohungsinformationsdienst von Chaitin Baichuan Cloud
description:
  en_US: This plugin connects to Chaitin Baichuan Cloud Threat Intelligence Service (https://rivers.chaitin.cn). It supports querying the threat level of IP addresses, historical attack behaviors (such as web attacks, SQL injections, backdoor connections, etc.), as well as geographic location, ASN, and ISP information.
  zh_Hans: 本插件对接长亭百川云威胁情报服务（https://rivers.chaitin.cn），支持查询 IP 地址的威胁等级、历史攻击行为（如 Web 攻击、SQL 注入、后门连接等）、地理位置、ASN 及 ISP 信息。
  ja_JP: このプラグインは、Chaitin Baichuan Cloud Threat Intelligence Service（長亭百川クラウド脅威インテリジェンスサービス）（https://rivers.chaitin.cn）に接続します。IPアドレスの脅威レベルや、過去の攻撃行動（Web攻撃、SQLインジェクション、バックドア接続など）、さらには地理的位置情報、ASN（自律システム番号）、ISP（インターネットサービスプロバイダー）に関する情報の照会（クエリ）をサポートしています。
  pt_BR: Dieses Plugin stellt eine Verbindung zum Chaitin Baichuan Cloud Threat Intelligence Service (https://rivers.chaitin.cn) her. Es unterstützt die Abfrage des Bedrohungsgrads von IP-Adressen, historischer Angriffsverhaltensweisen (wie Web-Angriffe, SQL-Injections, Backdoor-Verbindungen usw.) sowie von Informationen zur geografischen Position, ASN und zum ISP.
icon: icon.svg
resource:
  memory: 268435456
  permission: {}
plugins:
  tools:
    - provider/chaitin_ioc.yaml
meta:
