identity:
  author: "chaitin"
  name: "chaitin_ioc"
  label:
    en_US: Chaitin BaichuanCloud Threat Intelligence Service
    zh_Hans: 长亭百川云威胁情报服务
  description:
    en_US: This plugin connects to Chaitin Baichuan Cloud Threat Intelligence Service (https://rivers.chaitin.cn). It supports querying the threat level of IP addresses, historical attack behaviors (such as web attacks, SQL injections, backdoor connections, etc.), as well as geographic location, ASN, and ISP information.
    zh_Hans: 本插件对接长亭百川云威胁情报服务（https://rivers.chaitin.cn），支持查询 IP 地址的威胁等级、历史攻击行为（如 Web 攻击、SQL 注入、后门连接等）、地理位置、ASN 及 ISP 信息。
  icon: "icon.svg"
tools:
  - tools/chaitin_ioc.yaml
extra:
  python:
    source: provider/chaitin_ioc.py
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Chaitin BaichuanCloud Threat Intelligence Service Access Token
      zh_Hans: 长亭百川云威胁情报服务访问令牌
      pt_BR: Chaitin BaichuanCloud Threat Intelligence Service Access Token
    placeholder:
      en_US: Please enter Chaitin BaichuanCloud Threat Intelligence Service Access Token
      zh_Hans: 请输入长亭百川云威胁情报服务访问令牌
      pt_BR: Please enter Chaitin BaichuanCloud Threat Intelligence Service Access Token
    help:
      en_US: Please contact Chaitin to get the Access Token
      zh_Hans: 请联系长亭获取百川云威胁情报服务访问令牌
      pt_BR: Please contact Chaitin to get the Access Token