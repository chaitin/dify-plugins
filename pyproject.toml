[project]
name = "chaitin-dify-plugins-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<0.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
